<meta name="viewport" content="width=device-width,initial-scale=1">
<title>talastrat · mapa del motor</title>
<style>
:root{
  --bg:#080d0b;--panel:#0d1512;--panel2:#111c18;--panel3:#16241f;--border:#1e2f28;--border2:#2b453b;
  --text:#c8d8d0;--dim:#64897c;--faint:#3d5750;
  --verde:#54b391;--metal:#8fbfae;--rojo:#c94f4f;--ambar:#e0a341;--azul:#5a9fd4;--violeta:#9b87d4;--cyan:#3ec6b8;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;height:100%}
body{display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:baseline;gap:14px;padding:11px 18px 9px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-size:15px;letter-spacing:.14em;color:var(--verde);font-weight:700;text-transform:uppercase}
.brand b{color:var(--text)}
.sub{color:var(--dim);font-size:11px}
.hsearch{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border2);border-radius:4px;padding:5px 9px}
.hsearch input{all:unset;font:inherit;font-size:12px;color:var(--text);width:190px}
.hsearch input::placeholder{color:var(--faint)}
.hsearch span{color:var(--faint);font-size:11px}
.scopekey{display:flex;gap:9px;font-size:10px;color:var(--dim);align-items:center}
.sc{display:inline-block;padding:1px 5px;border-radius:3px;border:1px solid;font-size:9.5px;letter-spacing:.08em}
.sc.mot{color:var(--verde);border-color:var(--verde)}
.sc.vis{color:var(--azul);border-color:var(--azul)}
.sc.dat{color:var(--ambar);border-color:var(--ambar)}
.sc.bld{color:var(--violeta);border-color:var(--violeta)}

nav{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;overflow-x:auto}
nav button{all:unset;border-bottom:2px solid transparent;color:var(--dim);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{color:var(--verde);border-bottom-color:var(--verde)}
nav button:focus-visible{outline:1px solid var(--verde);outline-offset:-2px}

main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px}
#body{overflow-y:auto;padding:0}
#det{border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:16px 16px 30px}
.pane{display:none}.pane.on{display:block}

/* ---------- árbol ---------- */
.grp{border-bottom:1px solid var(--border)}
.grp>.gh{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;background:var(--panel)}
.grp>.gh:hover{background:var(--panel2)}
.gh .car{color:var(--faint);width:9px;font-size:10px}
.gh .gt{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.gh .gn{margin-left:auto;color:var(--faint);font-size:10px}
.grp.open>.gh .car{color:var(--verde)}
.gb{display:none;padding:2px 0 8px}
.grp.open>.gb{display:block}

.feat{display:flex;align-items:baseline;gap:9px;padding:6px 16px 6px 30px;cursor:pointer;border-left:2px solid transparent}
.feat:hover{background:var(--panel2)}
.feat.sel{background:var(--panel3);border-left-color:var(--verde)}
.feat .fn{font-weight:700;font-size:12.5px}
.feat .fd{color:var(--dim);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feat .fm{display:flex;gap:5px;flex-shrink:0;align-items:center}
.feat .cnt{color:var(--faint);font-size:10px}
.feat .des{color:var(--faint);font-size:9.5px;border:1px solid var(--border2);border-radius:3px;padding:1px 4px;white-space:nowrap}
.feat.hide{display:none}
.grp.hide{display:none}

/* ---------- detalle ---------- */
#det .kick{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
#det h2{font-size:15px;margin-bottom:3px;letter-spacing:.02em}
#det .lead{color:var(--dim);font-size:11.5px;line-height:1.55;margin:6px 0 4px}
#det h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:15px 0 6px;border-top:1px solid var(--border);padding-top:9px}
#det ul{list-style:none}
#det li{padding:4px 0 4px 14px;position:relative;font-size:12px;line-height:1.55}
#det li::before{content:"·";position:absolute;left:2px;color:var(--verde)}
#det li b{color:#e4f0ea;font-weight:700}
#det code,td code,.tw code{background:var(--panel2);border:1px solid var(--border);border-radius:3px;padding:0 4px;color:var(--cyan);font-size:11px}
#det .por{border-left:2px solid var(--rojo);padding:7px 0 7px 10px;color:var(--dim);font-size:11.5px;line-height:1.55;margin-top:10px}
#det .por b{color:var(--rojo);font-weight:700;letter-spacing:.1em;font-size:10px;display:block;margin-bottom:3px}
#det .no{border-left:2px solid var(--faint);padding:7px 0 7px 10px;color:var(--dim);font-size:11.5px;line-height:1.55;margin-top:10px}
#det .no b{color:var(--faint);font-weight:700;letter-spacing:.1em;font-size:10px;display:block;margin-bottom:3px}
#det .hint{color:var(--faint);font-size:10.5px;margin-top:20px}

/* ---------- tablas ---------- */
.tw{padding:14px 18px 34px}
.tw>p.intro{color:var(--dim);font-size:11.5px;line-height:1.6;max-width:860px;margin-bottom:12px}
.tw>h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:22px 0 8px}
table{width:100%;border-collapse:collapse}
th{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:left;
  padding:6px 8px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--bg);z-index:2}
td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:11.5px;vertical-align:top;line-height:1.45}
tbody tr:hover td{background:var(--panel2)}
td.k{color:var(--verde);white-space:nowrap}
td.n{color:var(--dim)}
td.v{color:var(--metal);white-space:nowrap}
.pos{color:var(--verde)}.neg{color:var(--rojo)}.mut{color:var(--faint)}
.tag{font-size:9.5px;letter-spacing:.08em;padding:1px 5px;border-radius:3px;border:1px solid;white-space:nowrap}
.tag.on{color:var(--verde);border-color:var(--verde)}
.tag.off{color:var(--rojo);border-color:var(--rojo)}
.tag.mid{color:var(--ambar);border-color:var(--ambar)}
.tag.neu{color:var(--faint);border-color:var(--faint)}
td .hint2{color:var(--faint);font-size:10.5px}

#tip{position:fixed;z-index:99;display:none;max-width:340px;background:#0a1210;border:1px solid var(--border2);
  border-radius:4px;padding:9px 11px;color:var(--dim);font-size:11px;line-height:1.55;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none}
#tip b{color:var(--text)}
[data-tip]{cursor:help}

footer{border-top:1px solid var(--border);color:var(--faint);font-size:10.5px;padding:7px 18px;display:flex;gap:16px;flex-shrink:0}
footer b{color:var(--dim);font-weight:400}

@media (max-width:920px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,.85fr)}
  #det{border-left:none;border-top:1px solid var(--border)}.hsearch input{width:120px}}
</style>
</head>

</footer>

<div id="tip"></div>

<script>
/* ================= tooltip ================= */
const tip=document.getElementById("tip");
document.addEventListener("mouseover",e=>{const t=e.target.closest("[data-tip]");if(!t)return;
  tip.innerHTML=t.dataset.tip;tip.style.display="block";move(e);});
document.addEventListener("mousemove",e=>{if(tip.style.display==="block")move(e);});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]"))tip.style.display="none";});
function move(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-14; if(y+h>innerHeight-8)y=e.clientY-h-16;
  tip.style.left=Math.max(4,x)+"px";tip.style.top=Math.max(4,y)+"px";}

  lead:"El día es la unidad en la que esto se vive: nadie decide “mi próxima operación va a ser distinta”, decide que hoy va a hacer las cosas de otra manera.",
  pts:["Para cada día operado calcula qué fracción de las conductas se sostuvo",
  "El corte son <b>terciles sobre la cantidad diaria</b>, aplicados a todos los días",
  "Solo habla si el patrón aguanta las dos mitades del historial",
  "Pide <b>8 días operados en total</b> (<code>DIAS_MIN</code>) y al menos 3 de cada lado del corte"],
  por:"El corte <b>no</b> puede ser la mediana diaria: con distribución bimodal cae encima de un modo y un lado queda vacío. Tampoco un ranking de días: desempatar por fecha manda los cargados a una punta del historial y los tranquilos a la otra, y ahí el split-half deja de controlar la época.",
  no:"<b>No pronostica.</b> La app no puede saber si hoy va a ser un día difícil, porque <code>userFillsByTime</code> devuelve operaciones y no precios ni volatilidad del subyacente. Cualquier proxy de FOMO armado con fills sería inventar la variable — el mismo motivo por el que “no mantener la calma” quedó sin medir."},

 {nm:"adherence",cp:"mot",des:24,fd:"últimas 20 contra todo lo anterior",
  lead:"Qué estás sosteniendo y qué soltaste. Necesita al menos 20 recientes más 4 de base.",

 {nm:"presupuesto",cp:"mot",des:8,fd:"mediana de las últimas 5, contra el tamaño que la banda habilita",
  lead:"Cuánto notional te habilita tu propia banda dado tu stop típico, y cuánto estás usando.",
  pts:["<b>Stop típico = la distancia al stop que la app te vio poner en vivo</b> (<code>holguraHist.stopMediano</code>), no cómo salieron tus perdedoras",
  "Con menos de <b>5 posiciones observadas con stop</b> la pieza se apaga, y dice qué le falta en vez de desaparecer",
  "Habilitado = banda ÷ (stop típico / 100)",
  "Estados: <span class='tag mid'>corto</span> por debajo de 0,6 · <span class='tag on'>en banda</span> · <span class='tag off'>pasado</span> por encima de 1,5"],
  por:"La ventana es de <b>5</b> y no de 10: con diez, cambiar tres operaciones no movía la mediana y la barra parecía rota.",
  por2:"<b>La tautología está cerrada por las dos puntas (3.1 y 3.3).</b> Era <code>habilitado = banda ÷ (stopTípico/100)</code> con <code>stopTípico</code> sacado de <code>|net| / notional</code> de las perdedoras: si la pérdida relativa fuera constante, el habilitado sería el promedio del notional <i>por construcción</i>, y como el notional se mueve solo con el colateral, <b>la barra podía marcarte “corto” simplemente porque perdiste</b>. 3.1 sacó la banda del PnL con el techo declarado; 3.3 sacó el stop, que ahora es el observado en vivo.",
  no:"<b>Se apaga más seguido que antes, y es a propósito.</b> La holgura tiene cobertura parcial por diseño —solo cubre lo que la app llegó a ver abierto— así que sin 5 observadas no hay barra. La alternativa era caer al cálculo viejo con un rótulo, y se descartó porque <b>es más fácil ignorar un rótulo que una barra apagada</b>. Apagada no es muda: dice cuántas lleva, cuántas faltan y por qué no se calcula con lo que hay. Lo que la reabriría es que a los dos meses siga apagada — ahí el problema es la cobertura, no el criterio."},

 {nm:"adherenciaSesion",cp:"mot",des:3,fd:"la conducta por franja horaria — diez celdas",
  lead:"<code>bySession</code> guarda <code>{n, net, wins}</code> y <b>las tres son resultado</b>. Esta agrupa la conducta: cómo se porta el proceso en cada franja, no cuánto se ganó en cada una.",
  pts:["<b>Diez celdas:</b> cinco sesiones fuera de la rueda —asia, hueco, pre, after, <b>finde</b>— más los cinco tramos en que la rueda está subdividida",
  "La rueda no es celda propia, o sus operaciones quedarían contadas dos veces",
  "Se guardan todas y se muestran las que llegan a <b>5 juicios medibles</b>; las flacas dicen <i>sin muestra</i>",
  "<b>Un juicio no es una operación:</b> cada operación aporta tantos como hábitos se le hayan podido medir, así que una celda puede tener 2 operaciones y 6 juicios",
  "<code>separa</code> contesta si la adherencia varía por hora, barajando a qué celda pertenece cada juicio"],
  por:"<b>Una celda vacía es información</b> —dice que casi no operás ahí— y colapsarla la esconde. Por eso <code>pct</code> es <code>null</code> y no 0 debajo del mínimo: en un mapa pintado por adherencia esa es la diferencia entre gris y rojo. Y la invariante 2 va entera: <code>sd</code> sale del denominador, porque si no, una franja con agujeros en la serie de colateral tendría peor adherencia sin que él hubiera hecho nada distinto — <b>el mapa estaría pintando la cobertura de un endpoint con los colores de la disciplina.</b>",
  no:"<b>Es la pieza que decide si 4.5 y 4.6 valen la pena.</b> Si las diez celdas no separan nada, el mapa del día y el PVT se caen con ella aunque los dibujos funcionen — y eso es la buena noticia del ítem: la parte barata es la que decide si vale la pena la cara. El número sale de abrir Diagnóstico."},

 {nm:"errorPronostico",cp:"mot",des:null,fd:"la quinta forma de fallar, sin proxy",
  lead:"“No mantener la calma” quedó sin medir a propósito, porque el único proxy disponible —las reentradas calientes— lo desmintieron sus propios datos. <b>Una pregunta directa no es un proxy: es la fuente.</b>",
  pts:["<b>No se guarda el nivel, se guarda la diferencia entre dos lecturas.</b> El pronóstico se declara antes de entrar; la lectura al cerrar, y solo si hubo pronóstico",
  "La variable es <code>movio − pronosticado</code>. Negativo es sobreestimar, que es lo que predice el <i>impact bias</i>",
  "Una operación con pronóstico y sin lectura no aporta un cero: aporta nada",
  "Tres ángulos del mismo dibujo — 0°, 19°, 56° — porque el ángulo <b>es</b> la pregunta y es ordinal por construcción",
  "No dice una palabra hasta los 30 pares completos"],
  por:"<b>La versión obvia es la trampa:</b> preguntar “¿cómo te sentís?” al cerrar y guardar el nivel. Al cerrar, el estado está determinado por el resultado — se obtiene una serie que correlaciona con el PnL, se la rotula “emoción”, y es el error #4 otra vez, ahora con la coartada de que lo dijo él. El pronóstico previo es lo que la vuelve acción: se elige antes, se mide adherencia después, que es la forma de <code>edgeDeclarado</code> y del <b>ejercicio</b>.",
  por2:"<b>La línea que desbloqueó el dibujo:</b> la salida varía la cara y mantiene el cuerpo derecho; la entrada varía el cuerpo y mantiene la cara igual. Las ocho expresiones de <code>CARAS</code> están tomadas por estados de salida, pero el ángulo del cuerpo no lo usa ninguno. Dos cosas que ese dibujo no puede hacer o el bloqueo vuelve: tomar el rojo de <code>PALETA.tilt</code> y animarse.",
  no:"Prohibido y escrito antes de construir nada: <b>racha de check-ins</b> (el pre-check solo se contesta si vas a entrar, sería una racha que se alimenta operando), <b>score emocional agregado</b>, <b>rueda de emociones</b> —nunca va a haber N por celda— y <b>decir qué hacer con el estado</b>, que es timing con ropa de apoyo emocional."},
]},

{g:"Estados",n:"tilt · aire · muestra",items:[
 {nm:"tilt",cp:"mot",des:5,fd:"racha ≥ 3 MÁS proceso roto, nunca solo por perder",
  lead:"La pieza más importante. Cuando se activa, la pantalla entera se tiñe de rojo con intensidad proporcional a la racha y los números de plata se difuminan.",
  pts:["Se enciende con racha perdedora ≥ 3 <b>y</b> al menos un motivo de proceso en las últimas 6 operaciones",
  "Motivos: una liquidación · una pérdida fuera de tu límite (el techo declarado, o 1,5× tu promedio) · una entrada por encima de 2× tu tamaño · 3 o más entradas a menos de cinco minutos de cerrar la anterior",
  "Se sale con <b>dos operaciones limpias</b>, donde limpia es conducta: una perdedora dentro de la banda cuenta, una ganadora al doble del tamaño no",

  por:"<b>Y se sale descansando.</b> Durante mucho tiempo <code>tilt</code> no recibía el tiempo: se calculaba sobre las últimas seis operaciones sin mirar cuándo habían pasado, así que tres pérdidas del viernes a la noche dejaban la pantalla roja el lunes a la mañana. Como la única salida eran dos limpias, la app terminaba diciendo sin decirlo que había que operar para zafar — el contador de redención que este proyecto prohíbe, colado por la puerta de atrás. Ahora se apaga con día nuevo de Buenos Aires <b>más</b> un hueco de 6 h. Las dos condiciones juntas: perder tres a las 23:50 no puede quedar limpio a las 00:10, y una siesta tampoco es empezar de nuevo."},

 {nm:"aire",cp:"mot",des:30,fd:"el espejo del tilt: proceso intacto, sin mirar el resultado",
  lead:"Salió de una idea suya: si el setup es EV+, el resultado de <i>esta</i> operación no informa nada; lo que informa es que se está sosteniendo el sistema. Difumina la plata igual que el tilt, por el motivo opuesto — no se tapa porque no puedas mirarla, se tapa porque no dice nada.",
  pts:["Ventana con tolerancia: <b>28 de las últimas 30</b>, y la última tiene que estar limpia",
  "Cuatro fallas medibles: <b>regla</b> (pérdida fuera del límite de <code>bandaRiesgo</code>, liquidación, tamaño fuera de [0,5× 2×]) · <b>ráfaga</b> (día por encima de 2,5× tu mediana diaria) · <b>parálisis</b> (hueco mayor a 8× tu hueco típico, medido como <b>tiempo sin ninguna posición abierta</b>) · <b>salto</b> (tamaño fuera de [0,4× 2,5×] contra las diez anteriores)",
  "<b>Estabilidad:</b> mediana de tamaño y de espera después de perder contra después de ganar. Si alguna razón se sale de la banda, no enciende.",
  "Puede encenderse en el medio de una racha perdedora — de hecho ahí es cuando sirve",
  "El tilt manda: si está activo, el aire no enciende"],
  por:"La parálisis cuenta como falla de la ventana pero queda <b>fuera</b> del candado de “la última tiene que estar limpia”. Antes, volver de un parón marcaba parálisis y apagaba el aire, pero no apagaba el tilt: descansar te sacaba lo bueno y te dejaba lo malo.",
  no:"La quinta falla que él nombra —“no mantener la calma”— queda sin medir a propósito. El proxy obvio serían las reentradas calientes, y sus propios datos ya las descartaron: rendían +US$0,21 por operación <b>mejor</b> que el resto y aguantaban el split-half. Inventar una falla que sus números desmienten sería peor que no medirla."},

 {nm:"muestra",cp:"mot",des:null,fd:"el aviso de arranque, debajo de 5 operaciones",
  lead:"Un panel arriba de todo que explica por qué media app está apagada, con el umbral de cada pieza.",

 {nm:"registrarHolgura · holguraHist",cp:"dat",des:null,fd:"el único dato que no se recalcula",
  lead:"La holgura —distancia al stop contra distancia a la liquidación— es la variable que él identificó como la real. <b>No se puede reconstruir del historial.</b>",
  pts:["<code>userFillsByTime</code> no devuelve ni el stop cargado ni el apalancamiento de esa posición",

{g:"Método o época",n:"lo que separa un hallazgo de un dato suelto",items:[
 {nm:"mitades",cp:"mot",des:10,fd:"primera mitad contra segunda, por fecha",
  lead:"El chequeo más barato para saber si lo que ves describe tu método o tu época.",
  pts:["Compara n, expectativa, acierto y pérdida promedio de cada mitad, con las fechas de cada tramo"]},

 {nm:"comparativas",cp:"mot",des:3,fd:"qué rindió cada contexto contra el resto",
  lead:"Descriptivo: el promedio por operación de cada grupo y el de su complemento. Sin recomendaciones.",
  pts:["Cortes: reentradas dentro de 30 min de una pérdida, entradas después de 2+ pérdidas seguidas, <b>más exposición que tu mediana</b>, cada sesión, cada tramo de la rueda, ventanas de evento, tesis, etiquetas, long, short, límite, duración",
  "El corte de tamaño le pregunta a <code>escalaTamano</code> como el resto de la app, usa <b>mediana</b> y no promedio, y <b>la etiqueta dice sobre qué base cortó</b> — cambia qué significa la fila y no puede quedar implícito",
  "Es el único corte con <b>tercer estado</b>: sin colateral de ese momento no hay exposición, así que esas operaciones salen del universo en vez de irse al “resto” por descarte",
  "Cada corte pide n ≥ 3 y un complemento no vacío",
  "<b>Épocas</b> (split-half) = la diferencia aparece en las dos mitades, con el mismo signo y ninguna en cero",
  "<b>p</b> = test de permutación con Benjamini-Hochberg al 10% encima: hasta 2000 barajadas de las etiquetas por corte, y la corrección por haber mirado todos los cortes a la vez",
  "La tabla lleva arriba <b>cuántos cortes se probaron y cuántos aguantan las dos cosas</b>. Sin ese aviso, la fila de arriba del ranking se lee como un descubrimiento"],
  por:"<b>Los dos filtros miden cosas distintas y ninguno reemplaza al otro.</b> <code>estable</code> controla la <i>época</i>; el p controla la <i>multiplicidad</i>. Bajo hipótesis nula coincidir en signo pasa la mitad de las veces, así que con 30 cortes unos 15 pasaban por azar y <code>repertorio</code> levantaba el primero como un hallazgo. Un corte puede aguantar el split-half y ser ruido igual, y puede tener un p chiquito y describir solo una época.",
  por2:"<b>Permutación y no un test t</b>, porque la distribución de PnL no es normal ni de cerca: cola larga por las liquidaciones, masa cerca de cero, muestras de 5 a 40 operaciones. Barajar no supone nada — construye la nula con sus propios datos. El RNG es <b>determinista y sembrado con el corte</b>: sin eso el mismo historial daría un p distinto en cada render. El p <b>nunca es cero</b> —<code>(1+extremos)/(1+B)</code>, Davison &amp; Hinkley— porque con B finito un cero afirmaría algo que no se midió. Y el cálculo <b>para en cuanto el p parcial pasa <code>q</code></b>, que lleva el costo de 76 ms a 13 sobre datos sin señal; el precio es que ese número es una cota, y la tabla muestra <code>&gt; 0,10</code> en vez de un decimal inventado.",
  no:"<b>Lo que ningún p arregla:</b> la frase decía “lo que más te cambia el resultado”, que afirma causalidad sobre un corte observacional. Ahora dice “donde más se separan tus números”. El problema era de diseño y no de muestra. <b>Y falta el número que importa:</b> sobre la fixture sintética son 9 cortes y no sobrevive ninguno, que es lo esperable sin señal — cuántos sobreviven con sus 175 operaciones sale de abrir la app."},

 {nm:"probRacha · rachasEsperadas",cp:"mot",des:10,fd:"programación dinámica exacta",
  lead:"Probabilidad exacta de que aparezca al menos una racha de k pérdidas en n operaciones, dado tu propio acierto. Separa “me está yendo mal” de “esto tenía que pasar”.",
  pts:["Tabla para k = 3, 5, 8 y 11 sobre 100 operaciones",
  "<b>Racha larga típica</b> = el mayor k cuya probabilidad todavía llega al 50%",
  "Los drawdowns largos son normales incluso haciendo todo bien, y acá va la probabilidad exacta al lado"],
  por:"<b>Usa <code>lossRate</code> y no <code>1 − winRate</code>, y no son lo mismo.</b> El empate exacto tiene caja propia desde que se vio que contarlo como ganadora inflaba el acierto; tomar el complemento volvería a meter los empates adentro de las pérdidas. <code>probRacha</code> pregunta por la probabilidad de <i>perder</i>, no por la de no ganar."},
]},

{g:"Douglas",n:"lo que entró de Trading in the Zone",items:[
 {nm:"marcarDeclaradas · edgeDeclarado",cp:"mot",des:null,fd:"decir la tesis antes, no después",
  lead:"<code>tesis</code> y <code>tags</code> existían como etiqueta post-hoc, y una etiqueta puesta después de ver el resultado no dice por qué entraste: dice cómo te explicaste lo que pasó.",
  pts:["La declaración vale para la próxima operación que abra después de escribirla, y solo dentro de las 4 horas — una tesis de hace tres días no explica la de hoy",
  "Mide qué fracción salió de una tesis previa y compara su resultado contra el resto",
  "No compara con menos de 5 de cada lado: describiría dos operaciones, no un método"],
  por2:"<b>Las que se vencen sin ejecutarse ya no se borran (4.2).</b> El shell las filtraba con el comentario “no se acumula historia muerta”, y estaba al revés: una declaración vencida es el único registro observable de un setup que vio y no tomó — los fills no la traen, porque una operación que no hiciste no deja fill. <b>El código estaba tirando exactamente el dato que mediría hesitación.</b> Se marcan, se guardan, y no se dice nada hasta las 30 cerradas: no ejecutar puede ser disciplina y no hesitación, y separarlas necesita ver dónde caen.",
  no:"La app no opina sobre el <b>contenido</b> de la tesis. Que “reversión en el cierre” sea buena o mala idea no es asunto suyo — eso sería prescripción de mercado. Lo único que mide es si lo dijiste antes y si lo respetaste."},

 {nm:"ejercicio",cp:"mot",des:3,fd:"N operaciones con reglas mecánicas, elegidas en frío",
  lead:"Elegís un subconjunto de las conductas medibles y las ejecutás 10, 20, 30 o 50 veces sin desviarte. El objetivo declarado no es ganar plata: es instalar la creencia de que podés sostener un sistema.",
  pts:["El veredicto es de conducta: dice cuántas de N salieron enteras. Sin aprobado ni desaprobado.",
  "Una serie de veinte perdedoras ejecutadas al pie de la letra es un ejercicio perfecto",
  "Si la declaración pide una regla que la app no sabe leer, se ignora — nunca se juzga contra algo que no puede medir",
  "<b>Pero lo dice.</b> Devuelve <code>ignoradas</code>, porque al borrar el hábito <code>corte</code> una serie declarada con él habría pasado a juzgarse con menos reglas, o habría desaparecido, sin que él tocara nada",
  "El tilt la cancela. Descansar, no."],
  por:"<b>Rompe a propósito la regla de “nada de contadores”.</b> La distinción que lo habilita es cuál es la meta y quién arranca: un contador de redención te encuentra adentro de un estado malo y te ofrece salir operando, y eso reproduce el pensamiento del tilt. Un contador de práctica lo arrancás vos, en frío, y apunta a una habilidad. El primero sigue prohibido; el segundo es todo el libro. Y lo que cancela la serie es haberte salido del sistema —el tilt no se enciende por perder— que es exactamente lo que Douglas cancelaría."},

 {nm:"verdades",cp:"mot",des:20,fd:"las cinco afirmaciones, con tu número al lado",
  lead:"Douglas las hace repetir como afirmación. Acá se dicen con el dato propio, que es la única forma en que esta app puede sostenerlas.",
  pts:["“Cualquier cosa puede pasar” → tu mejor y tu peor operación, salidas del mismo sistema",
  "“No necesitás saber qué va a pasar para ganar plata” → tu acierto y tu expectativa, y que la segunda no se deduce de la primera",
  "“Ganancias y pérdidas se reparten al azar” → tu peor racha contra la racha típica con tu acierto",
  "“Una ventaja es una probabilidad más alta, no una certeza” → cuánto vale la tuya cada cien operaciones. Con expectativa negativa cambia de texto y lo dice.",
  "“Cada momento del mercado es único” → tu símbolo más operado y el rango de resultados que dio"],
  por:"Sin muestra no se dicen. Una verdad sobre probabilidades afirmada con seis operaciones es una creencia disfrazada de dato."},
]},

{g:"Voz",n:"qué se dice y cuándo se calla",items:[
 {nm:"taladro",cp:"mot",des:null,fd:"prioridad fija, silencio incluido",
  lead:"No habla sin un número, habla poco, festeja antes de marcar, y después de una racha perdedora baja el tono.",
  pts:["Orden: sin stop → stop invertido → tilt → hito → ejercicio → <b>aire</b> → racha → hábito roto → presupuesto corto → silencio",

const treeEl=document.getElementById("tree");
/* Sin acentos: buscar "exposicion" tiene que encontrar "exposición". */
const pl=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let idx=[];
treeEl.innerHTML=TREE.map((g,gi)=>{
  const items=g.items.map((f,fi)=>{
    idx.push({gi,fi,txt:pl(g.g+" "+f.nm+" "+f.fd+" "+(f.lead||"")+" "+(f.pts||[]).join(" ")+" "+(f.por||"")+" "+(f.por2||"")+" "+(f.no||""))});
    const s=SCL[f.cp];
    const des=f.des?`<span class="des" data-tip="Existe desde <b>${f.des}</b> operaciones cerradas. Debajo de ese número la pieza no se calcula.">≥${f.des}</span>`:"";
    return `<div class="feat" data-g="${gi}" data-f="${fi}">
      <span class="fn">${f.nm}</span><span class="fd">${f.fd}</span>
      <span class="fm">${des}<span class="sc ${f.cp}" data-tip="${s[1]}">${s[0]}</span><span class="cnt">${(f.pts||[]).length}</span></span></div>`;
  }).join("");
  return `<section class="grp${gi<2?" open":""}" id="g${gi}">
    <div class="gh" data-g="${gi}"><span class="car">${gi<2?"▾":"▸"}</span><span class="gt">${g.g}</span>
    <span class="fd" style="color:var(--faint);font-size:11px">${g.n}</span><span class="gn">${g.items.length}</span></div>
    <div class="gb">${items}</div></section>`;
}).join("");

treeEl.addEventListener("click",e=>{
  const gh=e.target.closest(".gh");
  if(gh){const s=gh.parentElement;const o=s.classList.toggle("open");
    gh.querySelector(".car").textContent=o?"▾":"▸";return;}
  const f=e.target.closest(".feat");if(!f)return;
  document.querySelectorAll(".feat.sel").forEach(x=>x.classList.remove("sel"));
  f.classList.add("sel");showFeat(+f.dataset.g,+f.dataset.f);
});

const det=document.getElementById("det");
function showFeat(gi,fi){
  const g=TREE[gi],f=g.items[fi],s=SCL[f.cp];
  det.innerHTML=`<div class="kick">${g.g} · <span class="sc ${f.cp}">${s[0]}</span>${f.des?` · desde ${f.des} operaciones`:""}</div>
  <h2>${f.nm}</h2><div class="lead">${f.lead||f.fd}</div>
  ${(f.pts||[]).length?`<h3>Detalle</h3><ul>${f.pts.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}
  ${f.por?`<div class="por"><b>por qué funciona así</b>${f.por}</div>`:""}
  ${f.por2?`<div class="por"><b>y lo segundo</b>${f.por2}</div>`:""}
  ${f.no?`<div class="no"><b>lo que no hace / lo que falta</b>${f.no}</div>`:""}
  <div class="hint">${g.items.length} pieza${g.items.length===1?"":"s"} en ${g.g}</div>`;
  det.scrollTop=0;
}

/* ================= navegación y filtro ================= */
const nav=document.getElementById("nav");
nav.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  nav.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.p===b.dataset.p));
  document.getElementById("body").scrollTop=0;
});

const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const v=pl(q.value.trim());
  const feats=treeEl.querySelectorAll(".feat");
  if(!v){feats.forEach(f=>f.classList.remove("hide"));
    treeEl.querySelectorAll(".grp").forEach(g=>g.classList.remove("hide"));return;}
  const vivos={};
  idx.forEach((it,i)=>{const hit=it.txt.includes(v);feats[i].classList.toggle("hide",!hit);
    if(hit)vivos[it.gi]=true;});
  treeEl.querySelectorAll(".grp").forEach((g,gi)=>{
    g.classList.toggle("hide",!vivos[gi]);
    if(vivos[gi]&&!g.classList.contains("open")){g.classList.add("open");g.querySelector(".car").textContent="▾";}
  });
});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();q.select();}
  if(e.key==="Escape"&&document.activeElement===q){q.value="";q.dispatchEvent(new Event("input"));q.blur();}
});
</script>
